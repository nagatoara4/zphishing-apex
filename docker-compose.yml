version: '3.8'

services:
  zphishing:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://zphishing:zphishing@db:5432/zphishing_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - ./:/app
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=zphishing
      - POSTGRES_PASSWORD=zphishing
      - POSTGRES_DB=zphishing_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - zphishing
    restart: unless-stopped

volumes:
  postgres_data:
